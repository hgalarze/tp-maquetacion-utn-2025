  <main class="flex-shrink-0">
    <section class="hero d-flex flex-column justify-content-center gap-2 py-5">
      <div class="d-block mx-auto mb-4">
        <svg width="100" height="100" viewBox="0 0 36 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" clip-rule="evenodd"
            d="M25.8749 2.48878C28.9812 2.48878 31.4983 15.5745 31.4983 31.7156H36C36 14.3315 31.4663 0.240234 25.8749 0.240234C22.6935 0.240234 19.8555 4.47621 18 11.0982C16.1445 4.47621 13.3065 0.240234 10.1251 0.240234C4.53509 0.240234 0 14.3315 0 31.7156H4.50174C4.50174 15.5745 7.02015 2.48878 10.1251 2.48878C13.2314 2.48878 15.7498 14.5676 15.7498 29.4671H20.2502C20.2502 14.5676 22.7686 2.48878 25.8749 2.48878Z"
            fill="#FFBC0D"></path>
        </svg>
      </div>
      <h1 class="display-5 fw-bold text-white">
        <i class="bi bi-telephone-fill me-3"></i>Contacto
      </h1>
      <div class="col-lg-6 mx-auto">
        <p class="lead mb-4 px-2">¿Tenés alguna duda o sugerencia? Escribinos</p>
      </div>
    </section>

    <section class="destacados">
      <h2 class="fw-semibold text-center">Formulario de contacto</h2>
      <form class="formulario">

        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre:</label>
          <input type="text" class="form-control" id="nombre" placeholder="Escribe tu nombre" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email:</label>
          <input type="email" class="form-control" id="email" placeholder="Escribe tu correo electrónico" required>
        </div>

        <div class="mb-3">
          <label for="telefono" class="form-label">Teléfono:</label>
          <input type="tel" class="form-control" id="telefono" placeholder="Escribe tu teléfono">
        </div>

        <div class="mb-3">
          <label for="comentario" class="form-label">Comentario:</label>
          <textarea class="form-control" id="comentario" placeholder="Déjanos tu mensaje" rows="5"></textarea>
        </div>
        <div class="mb-3">
          <label for="motivo" class="form-label">Motivo:</label>
          <select class="form-select" id="motivo" name="motivo">
            <option value="consulta">Consulta</option>
            <option value="sugerencia">Sugerencia</option>
            <option value="reclamo">Reclamo</option>
            <option value="otros">Otros</option>
          </select>
        </div>
        <fieldset>
          <legend class="fs-5">¿Deseas recibir promociones?</legend>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="promociones" id="promociones1" value="si">
            <label class="form-check-label" for="promociones1">Sí</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="promociones" id="promociones2" value="no">
            <label class="form-check-label" for="promociones2">No</label>
          </div>
        </fieldset>
        <div class="botones d-flex justify-content-center align-items-center gap-4">
          <button type="submit">Enviar</button>
          <button type="reset">Resetear</button>
        </div>
      </form>
    </section>

  </main>
